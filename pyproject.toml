[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "datasets>=2.18",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "Pillow>=9.0",
]

[tool.setuptools.packages.find]
where = ["."]
