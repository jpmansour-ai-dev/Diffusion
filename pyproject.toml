[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "diffusion"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
